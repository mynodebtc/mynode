# Only pass requests that carry a logged-in MyNode web session.
# Include in a server block, then add "auth_request /mynode_auth_check;" to its locations.
location = /mynode_auth_check {
    internal;
    proxy_pass http://127.0.0.1:80/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
    # The answer is the same over HTTP or HTTPS, so skip the forced-HTTPS redirect
    proxy_set_header X-Forwarded-Proto https;
    # The session cookie is not: it is named for the scheme the client used, so pass that too
    proxy_set_header X-MyNode-Client-Scheme $scheme;
}

# Not logged in - log in on this same host and port (also the app's onion), then come back here
error_page 401 = @mynode_login;
location @mynode_login {
    return 302 $scheme://$http_host/mynode_ui/login?next=$mynode_return_path;
}

# The MyNode login for apps and the files it uses, under a prefix no app uses
location = /mynode_ui/login {
    proxy_pass http://127.0.0.1:80;
    include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    # Tells the login page which app this is
    proxy_set_header X-MyNode-App-Port $server_port;
    # The shared params above always say https, so pass this page the scheme the client used
    proxy_set_header X-MyNode-Client-Scheme $scheme;
}

location ^~ /mynode_ui/static/ {
    proxy_pass http://127.0.0.1:80/static/;
    include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
}
