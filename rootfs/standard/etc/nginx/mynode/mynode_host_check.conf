# Only answer to the host names in mynode_allowed_hosts.conf, and while Force HTTPS is on, send a
# plain HTTP request to this app's own HTTPS port. Include in a server block.
if ($mynode_host_ok = 0) {
    return 421;
}

# Which ports this applies to, and when, is decided in mynode_force_https_apps.conf. Found again
# every time rather than remembered, so turning the setting off takes effect at once.
if ($mynode_app_force_https) {
    return 302 https://$host:$mynode_app_https_port$request_uri;
}
