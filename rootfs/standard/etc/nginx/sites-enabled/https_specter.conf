server {
    listen 25441 ssl;
    server_name specter;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_specter.log;
    error_log /var/log/nginx/error_specter.log;

    # Wallet backups and PSBTs are uploaded through Specter
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:25442;

        # Rescans and hardware wallet signing can take a long time
        proxy_read_timeout 600s;

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }

}
