# CKBunker itself listens on 127.0.0.1:19823. Both ports here require a MyNode login.

# HTTP
server {
    listen 9823;
    server_name ckbunkerhttp;

    access_log /var/log/nginx/access_ckbunker_http.log;
    error_log /var/log/nginx/error_ckbunker_http.log;

    include /etc/nginx/mynode/mynode_session_auth.conf;

    location / {
        auth_request /mynode_auth_check;
        proxy_pass http://127.0.0.1:19823;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $mynode_proxy_cookie;
    }
    location /websocket {
        auth_request /mynode_auth_check;
        proxy_pass http://127.0.0.1:19823/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header Cookie $mynode_proxy_cookie;
    }
}

# HTTPS
server {
    listen 9824 ssl;
    server_name ckbunker;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_ckbunker.log;
    error_log /var/log/nginx/error_ckbunker.log;

    include /etc/nginx/mynode/mynode_session_auth.conf;

    location / {
        auth_request /mynode_auth_check;
        proxy_pass http://127.0.0.1:19823;

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }
    location /websocket {
        auth_request /mynode_auth_check;
        proxy_pass http://127.0.0.1:19823/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header Cookie $mynode_proxy_cookie;
    }
}