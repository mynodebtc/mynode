# The onion service's HTTP port, passed on to the web UI the same way https_www.conf passes 443
server {
    listen 127.0.0.1:81;
    server_name tor_www;

    access_log /var/log/nginx/access_www_tor.log;
    error_log /var/log/nginx/error_www_tor.log;

    location / {
        proxy_pass http://127.0.0.1:80;

        # Need high timeout for things like bitcoin-cli commands that can take a long time
        proxy_read_timeout 600s;

        proxy_redirect off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }
}
