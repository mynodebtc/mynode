# USB extras file servers listen on 127.0.0.1:18010-18014, one per device slot.
# Both ports for each slot require a MyNode login.

# Slot 1
server {
    listen 8010;
    server_name usb_extras1_http;

    access_log /var/log/nginx/access_usb_extras.log;
    error_log /var/log/nginx/error_usb_extras.log;

    include /etc/nginx/mynode/mynode_session_auth.conf;

    location / {
        auth_request /mynode_auth_check;
        proxy_pass http://127.0.0.1:18010;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $mynode_proxy_cookie;
    }
}

server {
    listen 8011 ssl;
    server_name usb_extras1;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_usb_extras.log;
    error_log /var/log/nginx/error_usb_extras.log;

    include /etc/nginx/mynode/mynode_session_auth.conf;

    location / {
        auth_request /mynode_auth_check;
        proxy_pass http://127.0.0.1:18010;

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }
}

