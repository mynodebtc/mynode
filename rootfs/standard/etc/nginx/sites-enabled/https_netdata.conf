# netdata itself listens on 127.0.0.1:29999

# HTTP
server {
    listen 19999;
    server_name netdatahttp;

    access_log /var/log/nginx/access_netdata_http.log;
    error_log /var/log/nginx/error_netdata_http.log;

    location / {
        proxy_pass http://127.0.0.1:29999;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# HTTPS
server {
    listen 20000 ssl;
    server_name netdata;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_netdata.log;
    error_log /var/log/nginx/error_netdata.log;

    location / {
        proxy_pass http://127.0.0.1:29999;

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }
}
