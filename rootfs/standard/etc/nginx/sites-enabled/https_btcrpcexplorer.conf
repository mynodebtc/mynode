# BTC RPC Explorer itself listens on 127.0.0.1:13002. Both ports here require a MyNode login.

# HTTP
server {
    listen 3002;
    server_name btcrpcexplorerhttp;

    access_log /var/log/nginx/access_btcrpcexplorer_http.log mynode_noquery;
    error_log /var/log/nginx/error_btcrpcexplorer_http.log;

    include /etc/nginx/mynode/mynode_session_auth.conf;

    location / {
        auth_request /mynode_auth_check;
        proxy_pass http://127.0.0.1:13002;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $mynode_proxy_cookie;
    }
}

# HTTPS
server {
    listen 3003 ssl;
    server_name btcrpcexplorer;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    # No query string in the log: the explorer's login token is passed in it
    access_log /var/log/nginx/access_btcrpcexplorer.log mynode_noquery;
    error_log /var/log/nginx/error_btcrpcexplorer.log;

    include /etc/nginx/mynode/mynode_session_auth.conf;

    location / {
        auth_request /mynode_auth_check;
        proxy_pass http://127.0.0.1:13002;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }
}
