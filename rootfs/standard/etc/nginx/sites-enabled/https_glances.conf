# Glances itself listens on 127.0.0.1:61210. Both ports here require a MyNode login.

# HTTP
server {
    listen 61208;
    server_name glanceshttp;

    access_log /var/log/nginx/access_glances_http.log;
    error_log /var/log/nginx/error_glances_http.log;

    include /etc/nginx/mynode/mynode_session_auth.conf;

    location / {
        auth_request /mynode_auth_check;
        proxy_pass http://127.0.0.1:61210;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $mynode_proxy_cookie;
    }
}

# HTTPS
server {
    listen 61209 ssl;
    server_name glances;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_glances.log;
    error_log /var/log/nginx/error_glances.log;

    include /etc/nginx/mynode/mynode_session_auth.conf;

    location / {
        auth_request /mynode_auth_check;
        proxy_pass http://127.0.0.1:61210;

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }

}
