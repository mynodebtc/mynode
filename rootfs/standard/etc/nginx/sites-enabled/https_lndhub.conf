# LNDHub itself listens on 127.0.0.1:13000

# HTTP
server {
    listen 3000;
    server_name lndhubhttp;

    include /etc/nginx/mynode/mynode_host_check.conf;

    access_log /var/log/nginx/access_lndhub_http.log;
    error_log /var/log/nginx/error_lndhub_http.log;

    location / {
        proxy_pass http://127.0.0.1:13000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $mynode_proxy_cookie;
    }
}

# HTTPS
server {
    listen 3001 ssl;
    server_name lndhub;

    include /etc/nginx/mynode/mynode_host_check.conf;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_lndhub.log;
    error_log /var/log/nginx/error_lndhub.log;

    location / {
        proxy_pass http://127.0.0.1:13000;

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }
}
