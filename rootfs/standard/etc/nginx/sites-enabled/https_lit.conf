server {
    listen 8443 ssl;
    server_name lit;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_lit.log;
    error_log /var/log/nginx/error_lit.log;

    include /etc/nginx/mynode/mynode_session_auth.conf;

    location / {
        auth_request /mynode_auth_check;
        # LiT keeps its own TLS on 127.0.0.1:8444 for litcli
        proxy_pass https://127.0.0.1:8444;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # The UI keeps streams open for updates
        proxy_read_timeout 3600s;

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }

}