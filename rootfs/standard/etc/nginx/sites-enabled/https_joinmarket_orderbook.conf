# The JoinMarket orderbook (ob-watcher) itself listens on 127.0.0.1:26601

# HTTP
server {
    listen 62601;
    server_name joinmarketorderbookhttp;

    include /etc/nginx/mynode/mynode_host_check.conf;

    access_log /var/log/nginx/access_joinmarket_orderbook_http.log;
    error_log /var/log/nginx/error_joinmarket_orderbook_http.log;

    location / {
        proxy_pass http://127.0.0.1:26601;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $mynode_proxy_cookie;
    }
}

# HTTPS
server {
    listen 62602 ssl;
    server_name joinmarketorderbook;

    include /etc/nginx/mynode/mynode_host_check.conf;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_joinmarket_orderbook.log;
    error_log /var/log/nginx/error_joinmarket_orderbook.log;

    location / {
        proxy_pass http://127.0.0.1:26601;

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }
}
