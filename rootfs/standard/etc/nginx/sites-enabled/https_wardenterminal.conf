# Warden Terminal itself listens on 127.0.0.1:15010. Both ports here require a MyNode login.

# HTTP
server {
    listen 5010;
    server_name wardenterminalhttp;

    access_log /var/log/nginx/access_wardenterminal_http.log;
    error_log /var/log/nginx/error_wardenterminal_http.log;

    include /etc/nginx/mynode/mynode_session_auth.conf;

    location / {
        auth_request /mynode_auth_check;
        proxy_pass http://127.0.0.1:15010;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $mynode_proxy_cookie;
    }
}

# HTTPS
server {
    listen 5011 ssl;
    server_name wardenterminal;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_wardenterminal.log;
    error_log /var/log/nginx/error_wardenterminal.log;

    include /etc/nginx/mynode/mynode_session_auth.conf;

    location / {
        auth_request /mynode_auth_check;
        proxy_pass http://127.0.0.1:15010;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }
}
