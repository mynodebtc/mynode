# Sphinx Relay itself listens on 127.0.0.1:63001

# HTTP (the Sphinx app connects over HTTP, or over Tor)
server {
    listen 53001;
    server_name sphinxrelay;

    include /etc/nginx/mynode/mynode_host_check.conf;

    access_log /var/log/nginx/access_sphinxrelay.log mynode_noquery;
    error_log /var/log/nginx/error_sphinxrelay.log;

    # Only for callers on the device itself, which use the localhost port
    location = /info {
        return 401;
    }

    location / {
        proxy_pass http://127.0.0.1:63001;

        # WebSocket support (socket.io)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $mynode_proxy_cookie;

        client_max_body_size 5m;
    }
}
