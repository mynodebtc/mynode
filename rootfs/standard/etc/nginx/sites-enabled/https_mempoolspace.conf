# mempool itself listens on 127.0.0.1:14080

# HTTP
server {
    listen 4080;
    server_name mempoolhttp;

    access_log /var/log/nginx/access_mempool_http.log;
    error_log /var/log/nginx/error_mempool_http.log;

    location / {
        proxy_pass http://127.0.0.1:14080;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /ws {
        proxy_pass http://127.0.0.1:14080/ws;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/v1/ws {
        proxy_pass http://127.0.0.1:14080/api/v1/ws;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# HTTPS
server {
    listen 4081 ssl;
    server_name mempool;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_mempool.log;
    error_log /var/log/nginx/error_mempool.log;

    location / {
        proxy_pass http://127.0.0.1:14080;

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }
    location /ws {
        proxy_pass http://127.0.0.1:14080/ws;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }
    location /api/v1/ws {
        proxy_pass http://127.0.0.1:14080/api/v1/ws;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }
}
