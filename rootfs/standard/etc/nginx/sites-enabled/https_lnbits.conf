# lnbits itself listens on 127.0.0.1:15000

# HTTP
server {
    listen 5000;
    server_name lnbitshttp;

    access_log /var/log/nginx/access_lnbits_http.log;
    error_log /var/log/nginx/error_lnbits_http.log;

    location / {
        proxy_pass http://127.0.0.1:15000;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# HTTPS
server {
    listen 5001 ssl;
    server_name lnbits;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_lnbits.log;
    error_log /var/log/nginx/error_lnbits.log;

    location / {
        proxy_pass http://127.0.0.1:15000;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }
}
