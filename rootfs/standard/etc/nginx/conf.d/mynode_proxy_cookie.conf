# Pass the web UI's session cookie to the web UI only (127.0.0.1:80), and other cookies to all.
# The session cookie goes by one of two names, one per scheme, and a browser can hold both at once,
# so each name is removed in its own step rather than relying on the fail-safe below.
map $http_cookie $mynode_cookie_strip_secure {
    default $http_cookie;
    "~^__Secure-mynode_session_id=[^;]*(;\s*)?(?<mynode_secure_cookie_rest>.*)$" $mynode_secure_cookie_rest;
    "~^(?<mynode_secure_cookie_pre>.*?);\s*__Secure-mynode_session_id=[^;]*(?<mynode_secure_cookie_post>.*)$" "$mynode_secure_cookie_pre$mynode_secure_cookie_post";
}

map $mynode_cookie_strip_secure $mynode_cookie_strip_first {
    default $mynode_cookie_strip_secure;
    "~^mynode_session_id=[^;]*(;\s*)?(?<mynode_cookie_rest>.*)$" $mynode_cookie_rest;
    "~^(?<mynode_cookie_pre>.*?);\s*mynode_session_id=[^;]*(?<mynode_cookie_post>.*)$" "$mynode_cookie_pre$mynode_cookie_post";
}

# If either name is somehow still there, send no cookies at all
map $mynode_cookie_strip_first $mynode_cookie_no_session {
    default $mynode_cookie_strip_first;
    "~(^|;)\s*(__Secure-)?mynode_session_id=" "";
}

map $proxy_host $mynode_proxy_cookie {
    default $mynode_cookie_no_session;
    127.0.0.1 $http_cookie;
    127.0.0.1:80 $http_cookie;
}
