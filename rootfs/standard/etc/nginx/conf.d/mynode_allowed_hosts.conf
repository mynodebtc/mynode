# Host names apps answer to: IP addresses, .onion names, MyNode's built-in names and the names added
# in Settings under Allowed Host Names. mynode_gen_nginx_allowed_hosts.sh writes the names file when
# nginx starts and when that list changes. Server blocks check it with mynode_host_check.conf.
map $host $mynode_host_ok {
    default 0;
    ~^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ 1;
    ~^\[[0-9a-f:.]+\]$ 1;
    ~\.onion$ 1;
    # A pattern, so nginx still starts before the file is first written
    include /etc/nginx/mynode/mynode_allowed_host_names*.conf;
}
