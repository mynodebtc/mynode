# While Force HTTPS is on, an app that is open to other devices moves a plain HTTP request to its
# own HTTPS port, so the setting covers those apps and not only the MyNode interface. Server blocks
# apply it through mynode_host_check.conf. mynode_gen_nginx_https_forced.sh writes the flag when
# nginx starts and when the setting changes.
map $host $mynode_https_forced {
    default 0;
    # A pattern, so nginx still starts before the file is first written, with HTTP left alone
    include /etc/nginx/mynode/mynode_https_forced*.conf;
}

# Onion addresses are already encrypted, and an app's onion forwards to its plain port, so moving
# them to an HTTPS port would only take the app off Tor
map $host $mynode_host_is_onion {
    default 0;
    ~\.onion$ 1;
}

# Clients on this device are left alone: apps in containers reach the ones in front of nginx as
# host.docker.internal (Jam reads the JoinMarket orderbook, Canary reads Mempool), service configs
# use localhost, nothing of theirs leaves the machine, and the certificate covers neither name
map $host $mynode_host_is_local {
    default 0;
    localhost 1;
    127.0.0.1 1;
    "[::1]" 1;
    host.docker.internal 1;
}

# The HTTPS port each plain port moves to. A port that is not listed is left alone - the onion
# vhost, the MyNode interface (which redirects itself), and apps with no HTTPS port of their own.
map $server_port $mynode_app_https_port {
    default "";
    3000  3001;     # LNDHub
    4080  4081;     # Mempool
    4200  4201;     # Public Pool UI
    5000  5001;     # LNbits
    5050  5051;     # nostr-rs-relay
    49392 49393;    # BTCPay Server
    62601 62602;    # JoinMarket orderbook
}

map "$mynode_https_forced:$mynode_host_is_onion$mynode_host_is_local:$mynode_app_https_port" $mynode_app_force_https {
    default 0;
    "~^1:00:[0-9]+$" 1;
}
