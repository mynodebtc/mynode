# Make sure the HTTPS and Electrum server certificates exist before nginx checks its config, such as
# on a fresh OS drive or before the drive is mounted. Without either, nginx does not start at all.
#
# ExecStartPre= clears the list so the certificate steps run before the config test from the
# packaged unit, which is added back unchanged. The - means a failure here never stops nginx.
[Service]
ExecStartPre=
ExecStartPre=-/usr/bin/mynode_gen_cert.sh https
ExecStartPre=-/usr/bin/mynode_gen_cert_electrs.sh
ExecStartPre=/usr/sbin/nginx -t -q -g 'daemon on; master_process on;'
