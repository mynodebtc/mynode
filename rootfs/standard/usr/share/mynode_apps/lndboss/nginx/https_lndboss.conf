# LndBoss itself listens on 127.0.0.1:18055. Both ports here require a MyNode login.

# HTTP
server {
    listen 8055;
    server_name lndbosshttp;

    access_log /var/log/nginx/access_lndboss_http.log;
    error_log /var/log/nginx/error_lndboss_http.log;

    include /etc/nginx/mynode/mynode_session_auth.conf;

    location / {
        auth_request /mynode_auth_check;
        proxy_pass http://127.0.0.1:18055;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $mynode_proxy_cookie;
    }
}

# HTTPS
server {
    listen 8056 ssl;
    server_name lndboss;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_lndboss.log;
    error_log /var/log/nginx/error_lndboss.log;

    include /etc/nginx/mynode/mynode_session_auth.conf;

    location / {
        auth_request /mynode_auth_check;
        proxy_pass http://127.0.0.1:18055;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }

}