# tunnelsats himself listens on 127.0.0.1:18739

# HTTP
server {
    listen 8739;
    server_name tunnelsatshttp;

    access_log /var/log/nginx/access_tunnelsats_http.log;
    error_log /var/log/nginx/error_tunnelsats_http.log;

    location / {
        proxy_pass http://127.0.0.1:18739;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# HTTPS
server {
    listen 8740 ssl;
    server_name tunnelsats;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_tunnelsats.log;
    error_log /var/log/nginx/error_tunnelsats.log;

    location / {
        proxy_pass http://127.0.0.1:18739;

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }
}
