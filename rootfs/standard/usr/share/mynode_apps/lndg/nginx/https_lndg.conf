# LNDg itself listens on 127.0.0.1:18889. Both ports here require a MyNode login.

# HTTP
server {
    listen 8889;
    server_name lndghttp;

    access_log /var/log/nginx/access_lndg_http.log;
    error_log /var/log/nginx/error_lndg_http.log;

    include /etc/nginx/mynode/mynode_session_auth.conf;

    location / {
        auth_request /mynode_auth_check;
        proxy_pass http://127.0.0.1:18889;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $mynode_proxy_cookie;
    }
}

# HTTPS
server {
    listen 8890 ssl;
    server_name lndg;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_lndg.log;
    error_log /var/log/nginx/error_lndg.log;

    include /etc/nginx/mynode/mynode_session_auth.conf;

    location / {
        auth_request /mynode_auth_check;
        proxy_pass http://127.0.0.1:18889;

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }

}