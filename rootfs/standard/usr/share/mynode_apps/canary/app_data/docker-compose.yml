version: "3.8"

services:
  backend:
    image: schjonhaug/canary-backend:v1.7.1
    user: "${CANARY_HOST_UID}:${CANARY_HOST_GID}"
    restart: unless-stopped
    stop_grace_period: 30s
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - /mnt/hdd/mynode/canary:/app/data
    env_file:
      - /mnt/hdd/mynode/canary/canary.env
    environment:
      CANARY_DATA_DIR: /app/data
      CANARY_ELECTRUM_URL: tcp://host.docker.internal:50001
      CANARY_NETWORK: mainnet
      CANARY_MODE: self-hosted
      CANARY_BIND_ADDRESS: 0.0.0.0:3004
      FRONTEND_URL: http://mynode.local:3005

  frontend:
    image: schjonhaug/canary-frontend:v1.7.1
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      - backend
    ports:
      - "3005:3005"
    environment:
      API_URL: http://backend:3004
      PORT: "3005"
