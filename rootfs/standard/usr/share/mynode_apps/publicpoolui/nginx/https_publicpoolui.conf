# The Public Pool UI itself listens on 127.0.0.1:14200, and the Public Pool API on port 3334

# HTTP
server {
    listen 4200;
    server_name publicpooluihttp;

    access_log /var/log/nginx/access_publicpoolui_http.log;
    error_log /var/log/nginx/error_publicpoolui_http.log;

    location / {
        proxy_pass http://127.0.0.1:14200;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3334;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# HTTPS
server {
    listen 4201 ssl;
    server_name publicpoolui;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_publicpoolui.log;
    error_log /var/log/nginx/error_publicpoolui.log;

    location / {
        proxy_pass http://127.0.0.1:14200;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3334;

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }
}
