# Serve astral's static build via HTTP
server {
    listen 5040;
    server_name astral;

    access_log /var/log/nginx/access_astral_http.log;
    error_log /var/log/nginx/error_astral_http.log;

    location / {
        root /opt/mynode/astral/dist/pwa;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 5041 ssl;
    server_name astral;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_astral.log;
    error_log /var/log/nginx/error_astral.log;

    location / {
        proxy_pass http://127.0.0.1:5040;

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }

}
