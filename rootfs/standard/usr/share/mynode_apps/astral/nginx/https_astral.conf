# Astral's static files, served by nginx on both ports. Both require a MyNode login.

# HTTP
server {
    listen 5040;
    server_name astralhttp;

    access_log /var/log/nginx/access_astral_http.log;
    error_log /var/log/nginx/error_astral_http.log;

    include /etc/nginx/mynode/mynode_session_auth.conf;

    location / {
        auth_request /mynode_auth_check;
        root /opt/mynode/astral/dist/pwa;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS
server {
    listen 5041 ssl;
    server_name astral;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_astral.log;
    error_log /var/log/nginx/error_astral.log;

    include /etc/nginx/mynode/mynode_session_auth.conf;

    location / {
        auth_request /mynode_auth_check;
        root /opt/mynode/astral/dist/pwa;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
