# nostrrsrelay itself listens on 127.0.0.1:15050

# HTTP
server {
    listen 5050;
    server_name nostrrsrelayhttp;

    access_log /var/log/nginx/access_nostrrsrelay_http.log;
    error_log /var/log/nginx/error_nostrrsrelay_http.log;

    location / {
        proxy_pass http://127.0.0.1:15050;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# HTTPS
server {
    listen 5051 ssl;
    server_name nostrrsrelay;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_nostrrsrelay.log;
    error_log /var/log/nginx/error_nostrrsrelay.log;

    location / {
        proxy_pass http://127.0.0.1:15050;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }
}
