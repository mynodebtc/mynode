version: '3'

services:
  lily-wallet:
    restart: on-failure
    volumes:
      - /mnt/hdd/mynode/lilywallet:/appdata
      - /dev/bus:/dev/bus:ro
      - /run/udev:/run/udev:ro
    build:
      dockerfile: ./Dockerfile
      context: ./
    environment:
      - EXPRESS_PORT=8080
      - ELECTRUM_IP=host.docker.internal
      - ELECTRUM_PORT=50001
      - APP_DATA_DIR=/appdata
    extra_hosts:
      - host.docker.internal:host-gateway
    devices:
      - /dev/bus/usb
    ports:
      - '5030:8080'
    device_cgroup_rules:
      - 'c 189:* rmw'
