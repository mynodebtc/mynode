# DATUM itself listens on 127.0.0.1:31000. Both ports here require a MyNode login.

# HTTP
server {
    listen 21000;
    server_name datumhttp;

    access_log /var/log/nginx/access_datum_http.log;
    error_log /var/log/nginx/error_datum_http.log;

    include /etc/nginx/mynode/mynode_session_auth.conf;

    # bitcoind's blocknotify (curl http://127.0.0.1:21000/NOTIFY) runs on this device without a session
    location = /NOTIFY {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:31000;
        proxy_set_header Cookie $mynode_proxy_cookie;
    }

    location / {
        auth_request /mynode_auth_check;
        proxy_pass http://127.0.0.1:31000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $mynode_proxy_cookie;
    }
}

# HTTPS
server {
    listen 21001 ssl;
    server_name datum;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_datum.log;
    error_log /var/log/nginx/error_datum.log;

    include /etc/nginx/mynode/mynode_session_auth.conf;

    location / {
        auth_request /mynode_auth_check;
        proxy_pass http://127.0.0.1:31000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }
}
