# sampleapp itself listens on 127.0.0.1:18000

# HTTP
server {
    listen 8000;
    server_name sampleapphttp;

    access_log /var/log/nginx/access_sampleapp_http.log;
    error_log /var/log/nginx/error_sampleapp_http.log;

    location / {
        proxy_pass http://127.0.0.1:18000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# HTTPS
server {
    listen 8001 ssl;
    server_name sampleapp;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_sampleapp.log;
    error_log /var/log/nginx/error_sampleapp.log;

    location / {
        proxy_pass http://127.0.0.1:18000;

        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }
}
